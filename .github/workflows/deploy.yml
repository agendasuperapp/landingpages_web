name: Build & Deploy (3 sites)

on:
  push:
    branches:
      - flutterflow   # ajuste se for "main" ou outra branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'

      # Corrige pacotes incompatíveis (caso FlutterFlow altere)
      - name: Corrigir dependências incompatíveis (collection e intl)
        run: |
          echo "🔧 Ajustando dependências para compatibilidade com o SDK do Flutter..."
          sed -i 's/collection: .*/collection: ^1.18.0/' pubspec.yaml || echo "collection ok"
          sed -i 's/intl: .*/intl: ^0.19.0/' pubspec.yaml || echo "intl ok"

      - name: Flutter pub get
        run: flutter pub get

      # Build único do projeto
      - name: Build Web (CanvasKit)
        run: flutter build web --release --web-renderer=canvaskit

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - name: agendasuper
            overlay: .github/overlays/agendasuper
            ftp_server: FTP_SERVER_ADMIN
            ftp_user: FTP_USER_ADMIN
            ftp_pass: FTP_PASS_ADMIN
            ftp_dir:  FTP_DIR_ADMIN
          - name: appfinanceiro
            overlay: .github/overlays/appfinanceiro
            ftp_server: FTP_SERVER_FIN
            ftp_user: FTP_USER_FIN
            ftp_pass: FTP_PASS_FIN
            ftp_dir:  FTP_DIR_FIN
          - name: rendarecorrente
            overlay: .github/overlays/rendarecorrente
            ftp_server: FTP_SERVER_AFI
            ftp_user: FTP_USER_AFI
            ftp_pass: FTP_PASS_AFI
            ftp_dir:  FTP_DIR_AFI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Criar pasta temporária e aplicar overlay
        run: |
          sudo apt-get update && sudo apt-get install -y rsync
          mkdir -p temp/${{ matrix.target.name }}
          echo "📦 Copiando arquivos do build web para pasta temporária..."
          rsync -av --delete web-build/ temp/${{ matrix.target.name }}/

          echo "🧩 Aplicando overlay para ${{ matrix.target.name }}..."
          rsync -av --exclude ".git" "${{ matrix.target.overlay }}/" "temp/${{ matrix.target.name }}/"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets[ matrix.target.ftp_server ] }}
          username: ${{ secrets[ matrix.target.ftp_user ] }}
          password: ${{ secrets[ matrix.target.ftp_pass ] }}
          local-dir: temp/${{ matrix.target.name }}/
          server-dir: ${{ secrets[ matrix.target.ftp_dir ] }}
          port: 21
          protocol: ftp
