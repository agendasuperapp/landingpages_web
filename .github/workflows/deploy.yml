name: Build & Deploy (3 sites)

on:
  push:
    branches:
      - flutterflow   # ✅ ajuste aqui se sua branch for "main" ou outro nome

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Baixa o código do FlutterFlow
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Instala o Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      # 3️⃣ Corrige automaticamente o conflito da dependência "collection"
      - name: Corrigir conflito de dependência (collection)
        run: |
          echo "🔧 Corrigindo versão do pacote collection para compatibilidade..."
          sed -i 's/collection: .*/collection: ^1.18.0/' pubspec.yaml || echo "Nada a corrigir"

      # 4️⃣ Instala as dependências
      - name: Flutter pub get
        run: flutter pub get

      # 5️⃣ Compila o build web (CanvasKit = mais performance e compatível com Hostinger)
      - name: Build Web (CanvasKit)
        run: flutter build web --release --web-renderer=canvaskit

      # 6️⃣ Publica o build como artefato para ser usado no job de deploy
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # 7️⃣ Executa o deploy em paralelo para os 3 sites
    strategy:
      matrix:
        target:
          - name: agendasuper
            overlay: .github/overlays/agendasuper
            ftp_server: FTP_SERVER_ADMIN
            ftp_user: FTP_USER_ADMIN
            ftp_pass: FTP_PASS_ADMIN
            ftp_dir:  FTP_DIR_ADMIN
          - name: appfinanceiro
            overlay: .github/overlays/appfinanceiro
            ftp_server: FTP_SERVER_FIN
            ftp_user: FTP_USER_FIN
            ftp_pass: FTP_PASS_FIN
            ftp_dir:  FTP_DIR_FIN
          - name: rendarecorrente
            overlay: .github/overlays/rendarecorrente
            ftp_server: FTP_SERVER_AFI
            ftp_user: FTP_USER_AFI
            ftp_pass: FTP_PASS_AFI
            ftp_dir:  FTP_DIR_AFI

    steps:
      # 8️⃣ Baixa o repositório e o build
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      # 9️⃣ Aplica os arquivos personalizados (index.html, manifest.json, .htaccess, etc.)
      - name: Apply overlay (inclui dotfiles)
        run: |
          sudo apt-get update && sudo apt-get install -y rsync
          echo "📦 Aplicando overlay ${{ matrix.target.overlay }}"
          rsync -av --delete --exclude ".git" "${{ matrix.target.overlay }}/" "web-build/"

      # 🔟 Envia via FTP para a hospedagem correspondente
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets[ matrix.target.ftp_server ] }}
          username: ${{ secrets[ matrix.target.ftp_user ] }}
          password: ${{ secrets[ matrix.target.ftp_pass ] }}
          local-dir: web-build/
          server-dir: ${{ secrets[ matrix.target.ftp_dir ] }}
