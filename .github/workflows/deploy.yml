name: Build & Deploy (3 sites)

on:
  push:
    branches:
      - main   # ou 'production' se for o seu padrão

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'   # ajuste se precisar

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Web (CanvasKit)
        run: flutter build web --release --web-renderer=canvaskit

      # Publica o build como artefato para os próximos jobs
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/

  deploy:
    needs: build
    runs-on: ubuntu-latest
strategy:
  matrix:
    target:
      - name: agendasuper
        overlay: .github/overlays/agendasuper
        ftp_server: FTP_SERVER_ADMIN
        ftp_user: FTP_USER_ADMIN
        ftp_pass: FTP_PASS_ADMIN
        ftp_dir:  FTP_DIR_ADMIN
      - name: appfinanceiro
        overlay: .github/overlays/appfinanceiro
        ftp_server: FTP_SERVER_FIN
        ftp_user: FTP_USER_FIN
        ftp_pass: FTP_PASS_FIN
        ftp_dir:  FTP_DIR_FIN
      - name: rendarecorrente
        overlay: .github/overlays/rendarecorrente
        ftp_server: FTP_SERVER_AFI
        ftp_user: FTP_USER_AFI
        ftp_pass: FTP_PASS_AFI
        ftp_dir:  FTP_DIR_AFI


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Apply overlay (inclui dotfiles)
        run: |
          sudo apt-get update && sudo apt-get install -y rsync
          rsync -av --delete --exclude ".git" "${{ matrix.target.overlay }}/" "web-build/"
        # Observação:
        # - rsync -a inclui arquivos ocultos (.htaccess)
        # - --delete mantém remoto idêntico ao local (cuidado!)
        # - Overlays substituem/adição de arquivos no web-build

      # Opção 1: Deploy via FTP tradicional
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets[ matrix.target.ftp_server ] }}
          username: ${{ secrets[ matrix.target.ftp_user ] }}
          password: ${{ secrets[ matrix.target.ftp_pass ] }}
          local-dir: web-build/
          server-dir: ${{ secrets[ matrix.target.ftp_dir ] }}
          # danger: true   # habilite se quiser ignorar deletes seguros
          # dry-run: true  # teste sem enviar de fato

      # ---- Opção 2 (SFTP): comente o bloco de FTP acima e use o de SFTP abaixo ----
      # - name: Deploy via SFTP
      #   uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      #   with:
      #     username: ${{ secrets[ matrix.target.ftp_user ] }}
      #     server: ${{ secrets[ matrix.target.ftp_server ] }}
      #     ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}   # se usar chave
      #     password: ${{ secrets[ matrix.target.ftp_pass ] }} # ou use password
      #     local_path: "web-build/*"
      #     remote_path: ${{ secrets[ matrix.target.ftp_dir ] }}
      #     args: "-o ConnectTimeout=30"
