name: Build & Deploy (3 sites)

on:
  push:
    branches:
      - flutterflow   # ajuste se o FlutterFlow usar outra branch (ex: main)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clona o repositório
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Instala o Flutter (versão recomendada)
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'  # ajuste se seu FlutterFlow usar versão diferente

      # 3️⃣ Corrige dependências incompatíveis (caso o FlutterFlow altere)
      - name: Corrigir dependências incompatíveis (collection e intl)
        run: |
          echo "🔧 Ajustando dependências..."
          sed -i 's/collection: .*/collection: ^1.19.0/' pubspec.yaml || echo "collection ok"
          sed -i 's/intl: .*/intl: ^0.20.2/' pubspec.yaml || echo "intl ok"

      # 4️⃣ Limpa e reconstrói dependências
      - name: Preparar ambiente Flutter limpo
        run: |
          flutter clean
          flutter pub get
          flutter --version
          dart --version


      # 5️⃣ Build web (igual ao script.bat)
      - name: Build Web (modo release, igual ao local)
        run: |
          echo "🚀 Iniciando build web..."
          flutter build web --release

      # 6️⃣ Exibe informações do build (para diagnóstico)
      - name: Verificar arquivos gerados
        run: |
          echo "📁 Conteúdo da pasta build/web:"
          ls -lh build/web/ | head -20
          echo "📦 Tamanho do main.dart.js:"
          du -h build/web/main.dart.js || true

      # 7️⃣ Salva o build como artefato para o job de deploy
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - name: agendasuper
            overlay: .github/overlays/agendasuper
            ftp_server: FTP_SERVER_ADMIN
            ftp_user: FTP_USER_ADMIN
            ftp_pass: FTP_PASS_ADMIN
            ftp_dir:  FTP_DIR_ADMIN
          - name: appfinanceiro
            overlay: .github/overlays/appfinanceiro
            ftp_server: FTP_SERVER_FIN
            ftp_user: FTP_USER_FIN
            ftp_pass: FTP_PASS_FIN
            ftp_dir:  FTP_DIR_FIN
          - name: rendarecorrente
            overlay: .github/overlays/rendarecorrente
            ftp_server: FTP_SERVER_AFI
            ftp_user: FTP_USER_AFI
            ftp_pass: FTP_PASS_AFI
            ftp_dir:  FTP_DIR_AFI

    steps:
      # 8️⃣ Checkout + download do build
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      # 9️⃣ Cria pasta temporária e aplica overlay personalizado
      - name: Criar pasta temporária e aplicar overlay
        run: |
          sudo apt-get update && sudo apt-get install -y rsync
          mkdir -p temp/${{ matrix.target.name }}
          echo "📦 Copiando build web base..."
          rsync -av --delete web-build/ temp/${{ matrix.target.name }}/
          echo "🧩 Aplicando overlay de ${{ matrix.target.name }}..."
          rsync -av --exclude ".git" "${{ matrix.target.overlay }}/" "temp/${{ matrix.target.name }}/"

      # 🔟 Faz o deploy via FTP (modo release)
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets[ matrix.target.ftp_server ] }}
          username: ${{ secrets[ matrix.target.ftp_user ] }}
          password: ${{ secrets[ matrix.target.ftp_pass ] }}
          protocol: ftp
          port: 21
          local-dir: temp/${{ matrix.target.name }}/
          server-dir: ${{ secrets[ matrix.target.ftp_dir ] }}
