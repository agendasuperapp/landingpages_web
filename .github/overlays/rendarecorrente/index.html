  <base href="/">

  <meta charset="UTF-8">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- Open Graph & SEO tags -->
  <meta property="og:title" content="APP Afiliado" />

<body>
  
  
  



<script>
//🔷🔷🔷🔷 CONTROLE DE VERSAO DO SISTEMA
  // ✅ Versão manual do app (altere quando atualizar)
  const appVersion = "1.0.0";


  // ✅ Adiciona parâmetro de versão ao main.dart.js
  const script = document.createElement('script');
  script.src = 'main.dart.js?v=' + appVersion;
  document.body.appendChild(script);

  // ✅ Armazena versão no localStorage para uso no FlutterFlow
  localStorage.setItem('app_version', appVersion);
  window.appVersion = appVersion;

</script>
